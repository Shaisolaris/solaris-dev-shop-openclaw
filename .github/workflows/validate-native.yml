name: Native OpenClaw distribution
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native-source-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: published
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Shaisolaris/solaris-dev-shop-plugins
          ref: 2c11999a1a13912fbb694228b176bc4ebb5f165e
          path: distribution
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Every native profile file and mode matches the immutable source
        run: |
          python - <<'PY'
          import io,json,hashlib,subprocess,tarfile
          from pathlib import Path
          ref='2c11999a1a13912fbb694228b176bc4ebb5f165e'
          root=Path('published');expected=set()
          with tarfile.open(fileobj=io.BytesIO(subprocess.check_output(['git','-C','distribution','archive',ref+':harnesses/openclaw']))) as t:
              for member in t:
                  if not member.isfile():continue
                  path=root/member.name;expected.add(member.name)
                  assert path.is_file() and not path.is_symlink() and path.read_bytes()==t.extractfile(member).read(),member.name
                  assert bool(path.stat().st_mode&0o111)==bool(member.mode&0o111),member.name
          actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file() and '.git' not in p.relative_to(root).parts}
          extras={'marketplace.json','NATIVE-INSTALL.md','SOLARIS-DISTRIBUTION-SOURCE.json','.github/workflows/validate-native.yml','tools/verify_openclaw_normal_host.py'}
          assert actual==expected|extras,sorted(actual^(expected|extras))
          print('Exact native profile files/modes:',len(expected))
          PY
      - name: Real composite provenance and cross-checks
        run: |
          python -B published/examples/capabilities/G38/authority_oracle.py
          python -B published/examples/capabilities/G42/cross_checks.py
      - name: Normal isolated OpenClaw installation, all source bytes and refusal recovery
        run: |
          npm install --prefix "$RUNNER_TEMP/host" --ignore-scripts --no-audit --no-fund openclaw@2026.10.5
          mkdir "$RUNNER_TEMP/exact-profile"
          git -C distribution archive 2c11999a1a13912fbb694228b176bc4ebb5f165e:harnesses/openclaw | tar -x -C "$RUNNER_TEMP/exact-profile"
          python -B published/tools/verify_openclaw_normal_host.py --node "$(command -v node)" --cli "$RUNNER_TEMP/host/node_modules/openclaw/openclaw.mjs" --profile "$RUNNER_TEMP/exact-profile" --work "$RUNNER_TEMP/openclaw-normal-068"
